name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # CI no tiene .env: todo lo que lee el arranque va explícito y sin secretos.
    # Pago mock y visión en replay: el gate nunca llama a Reap ni a OpenRouter.
    env:
      DEMO_MODE: '1'
      BACKEND: real
      PAYMENT_PROVIDER: mock
      VISION_MODE: replay
      PARTPROOF_DB: ':memory:'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
