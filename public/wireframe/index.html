<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PartProof · Wireframes del recorrido</title>
  <link rel="stylesheet" href="wireframe.css">
</head>
<body>
  <header class="review-bar">
    <a class="review-brand" href="#flota">PARTPROOF <span>WIREFRAME / 01</span></a>
    <label>Pantalla <select id="screen"></select></label>
    <div class="option-switch" role="group" aria-label="Composición">
      <button data-option="a" aria-pressed="true">A</button>
      <button data-option="b" aria-pressed="false">B</button>
      <button data-option="c" aria-pressed="false">C</button>
    </div>
    <label class="check-label"><input id="compare" type="checkbox"> Comparar 3</label>
    <button id="size" aria-pressed="false">Vista móvil</button>
  </header>
  <main class="review-main">
    <div class="review-heading"><div><p class="eyebrow">RECORRIDO DEL TÉCNICO / FORJA3D MX</p><h1 id="review-title"></h1></div><p id="review-description"></p></div>
    <nav id="journey" class="journey" aria-label="Pantallas del recorrido"></nav>
    <div class="scenario-bar">
      <label>Solicitud <select id="machine"><option value="P1">P1 · Cable · Permitida</option><option value="P2">P2 · PTFE · Incompatible</option><option value="P3">P3 · PTFE · Compatible</option><option value="P4">P4 · Boquilla · Sin envío</option></select></label>
      <label>Resultado ilustrativo <select id="payment"><option value="paid">Pago confirmado</option><option value="failed">Pago fallido</option><option value="pending">Pendiente de conciliación</option></select></label>
      <p>Datos de ejemplo · Los botones recorren el mockup · Sin compras ni cámara real</p>
    </div>
    <section id="frames" aria-label="Alternativas de la pantalla"></section>
    <p class="review-footnote">A / lectura editorial · B / workspace estructurado · C / pieza y contexto. Las imágenes son esquemas, no evidencia fotográfica.</p>
  </main>
  <div id="notice" class="notice" role="status" aria-live="polite"></div>
  <script type="module" src="wireframe.mjs"></script>
</body>
</html>
